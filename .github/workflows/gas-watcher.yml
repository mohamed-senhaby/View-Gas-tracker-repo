name: Gas Price Watcher

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: gas-price-watcher
  cancel-in-progress: false

jobs:
  check-price:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      # Keeps state.json (station IDs, notified-flag) between runs WITHOUT
      # ever committing it to the repo — kept private to the workflow cache.
      - name: Restore watcher state
        uses: actions/cache@v4
        with:
          path: state.json
          key: gas-watcher-state-${{ github.run_id }}
          restore-keys: |
            gas-watcher-state-

      # Non-secret preferences live here directly — edit these values to
      # change fuel type / threshold / radius. Only the actual credentials
      # and your address come from GitHub Secrets.
      - name: Write config.json
        env:
          TANKERKOENIG_API_KEY: ${{ secrets.TANKERKOENIG_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOCATION: ${{ secrets.LOCATION }}
        run: |
          python3 - <<'PY'
          import json, os

          config = {
              "tankerkoenig_api_key": os.environ["TANKERKOENIG_API_KEY"],
              "telegram_bot_token": os.environ["TELEGRAM_BOT_TOKEN"],
              "telegram_chat_id": os.environ["TELEGRAM_CHAT_ID"],
              "location": os.environ["LOCATION"],
              "radius_km": 5,
              "fuel_type": "e5",
              "price_threshold": 2,
              "check_interval_minutes": 10,
          }
          with open("config.json", "w", encoding="utf-8") as f:
              json.dump(config, f, ensure_ascii=False, indent=2)
          PY

      - name: Run watcher (single check)
        run: python3 gas_price_watcher.py --once
